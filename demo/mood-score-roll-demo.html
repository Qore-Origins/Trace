<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情分数滚动 Demo · 迹 Trace</title>
<!--
  心情数值滚动 Demo（odometer 选型）
  两变体：V1 轮带式（每列 0-9 循环竖带，机械计数器感，主推）/ 无动画
  2026-09-09 用户定案：V2 翻页式效果一般已剔除；应用内该动画进设置（scoreAnim：roll / none）
  本文件为独立原型，无构建依赖，直接浏览器打开。

  V1 边界设计（小数进位/结构变化/链式往返）：
    - 布局规范串：d = max(当前显示小数位, 目标小数位)——进位产生的尾 0 保留，
      值 45.29 +0.01 → 显示 45.30（十分位 2→3 与百分位 9→0 同时滚）；45.9 +0.1 → 46.0
      （标签区显示真实值 String(n)，与轮盘的机械显示一致/由 d 规则决定）
    - 列状态机：每列记录物理位置 phys（绝对索引），短路径取差 >5 反向绕行（0↔9 只滚 1 格）；
      由 phys 驱动而不是"按数字算索引"，修复进位后停在 0 复制槽、链式下一次滚动空跳 9 格的瞬变
    - strip 为 0-9 循环带（初始 12 块/120 行，phys 居中）：长期链式滚动接近边界时自动追加块；
      顶部溢出为兜底重建（需 50+ 次连续向下绕行，实际不可达）
    - 结构增长（新增整数列/小数列）：先建目标结构并定位到补齐起点，强制 reflow 提交起点样式后滚至目标
      （新建元素无先前渲染，不强制提交则 transition 不触发）——
      50 → 50.1：先显示 50.0，小数位 0→1 滚入；9.5 → 10.0：新前导列 0→1 滚入
    - 结构缩减（100 → 99）：app 侧已升级为"共同大结构滚动（100→099）+ 延时移除前导列"
      （mood-roll-machine shrink 动作，2026-09-09 用户反馈后实现，无空跳）；
      本 demo 保留选型期的瞬时重建简化版——demo 职责为选型，行为以 app 为准
    - 所有值经 norm（±2dp round）防浮点串化（滑杆 0.01 步进会产生 45.29000000000000649）

  移植要点（定稿后）：
    - token 与 workspace.css 一致（--ease-out/--t-roll 需进 :root 时序段）
    - V1 实现：列状态（phys）+ 短路径方向规则；帧更新使用 WAAPI；prefers-reduced-motion 时跳过动画直接到位
    - 列宽用 tabular-nums + 等宽容器，避免数字跳变时列抖动
    - 组件持有显示状态：从上一目标值（而非 DOM 当前值）计算下一次滚动，链式点击不断链
-->
<style>
/* ---------- token（同 workspace.css） ---------- */
:root {
  --trace-500: #1677ff;
  --trace-bg: #e6f4ff;
  --text-1: #262626;
  --text-2: #595959;
  --text-3: #8c8c8c;
  --text-4: #bfbfbf;
  --split: #f0f0f0;
  --border: #d9d9d9;
  --paper: #ffffff;
  --paper-dim: #fafafa;

  --t-roll: 260ms;   /* 单格滚动时长（demo 可调） */
  --ease-out: cubic-bezier(.2, .7, .3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--paper-dim); color: var(--text-1); font-size: 14px; }

.demo { display: flex; height: 100%; }
.demo-main { flex: 1; display: flex; align-items: center; justify-content: center; }

/* ---------- 心情卡（近似组件视觉） ---------- */
.mood-card {
  width: 560px; background: var(--paper); border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  padding: 18px 22px;
}
.mood-card .kind { font-size: 12px; color: var(--text-4); margin-bottom: 10px; }
.mood-row { display: flex; align-items: center; gap: 16px; }
.mood-label { font-size: 13px; color: var(--text-3); flex: none; }

/* ---------- 分数区（三变体共用尺寸） ---------- */
.score-frame {
  height: 64px; overflow: hidden; display: flex; align-items: center;
  font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums;
  color: rgb(96,130,182); min-width: 120px;
}
.score-frame .num { display: inline-block; height: 64px; line-height: 64px; }
.score-frame .point { display: inline-block; height: 64px; line-height: 64px; }

/* V1 轮带列 */
.odom-col { display: inline-flex; flex-direction: column; overflow: hidden; height: 64px; }
.odom-col .strip { transition: transform var(--t-roll) var(--ease-out); will-change: transform; }
.odom-col .strip span { display: block; height: 64px; line-height: 64px; }

/* ---------- 参数面板 ---------- */
.panel {
  width: 320px; background: var(--paper); border-left: 1px solid var(--split);
  padding: 18px 20px; overflow: auto;
}
.panel h3 { font-size: 15px; margin-bottom: 14px; }
.panel section { margin-bottom: 16px; }
.panel label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-2); }
.panel input[type=range] { width: 100%; }
.panel .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.panel button {
  border: 1px solid var(--border); background: var(--paper); border-radius: 6px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--text-2);
}
.panel button:hover { background: var(--trace-bg); color: var(--trace-500); border-color: var(--trace-500); }
.panel .note { font-size: 12px; color: var(--text-4); line-height: 1.6; margin-top: 6px; }
.radio-row { display: flex; gap: 12px; align-items: center; font-size: 13px; }
</style>
</head>
<body>
<div class="demo">
  <div class="demo-main">
    <div class="mood-card">
      <div class="kind">今日心情</div>
      <div class="mood-row">
        <span class="mood-label">心情分数</span>
        <div class="score-frame" id="scoreFrame"></div>
        <span class="mood-label" id="scoreTextLabel" style="min-width:56px; text-align:right; font-size:16px;">50</span>
      </div>
    </div>
  </div>
  <div class="panel">
    <h3>滚动 Demo 选型</h3>
    <section>
      <label>变体</label>
      <div class="radio-row">
        <label><input type="radio" name="variant" value="1" checked> V1 轮带式（机械计数器）</label>
      </div>
      <div class="radio-row">
        <label><input type="radio" name="variant" value="none"> 无动画</label>
      </div>
      <div class="note">V2 翻页式已剔除（用户定案：设置中仅 轮带式/无动画 两项）。</div>
    </section>
    <section>
      <label>增减</label>
      <div class="btn-row">
        <button id="btnMinus">-1</button>
        <button id="btnPlus">+1</button>
        <button id="btnMinus01">-0.1</button>
        <button id="btnPlus01">+0.1</button>
        <button id="btnPlus001">+0.01</button>
        <button id="btnPlus5">+5（感受 95→100 进位）</button>
        <button id="btnRandom">随机</button>
      </div>
    </section>
    <section>
      <label>边界用例（自动演示：先落到起点，再播放滚动）</label>
      <div class="btn-row">
        <button data-case="45.29,45.3">45.29 → 45.3（+0.01 小数进位）</button>
        <button data-case="45.9,46">45.9 → 46（跨整数进位）</button>
        <button data-case="99.9,100">99.9 → 100（进位+新列）</button>
        <button data-case="9.5,10">9.5 → 10（整数位增长）</button>
        <button data-case="50,50.1">50 → 50.1（小数列插入）</button>
        <button data-case="100,99.9">100 → 99.9（缩减·瞬时重建）</button>
      </div>
    </section>
    <section>
      <label>拖动值：<span id="sliderVal">50</span></label>
      <input type="range" id="slider" min="0" max="100" step="0.01" value="50">
    </section>
    <section>
      <label>速度</label>
      <div class="radio-row">
        <label><input type="radio" name="speed" value="0.5"> 慢 0.5×</label>
        <label><input type="radio" name="speed" value="1" checked> 1×</label>
        <label><input type="radio" name="speed" value="2"> 快 2×</label>
      </div>
    </section>
    <section>
      <label>辅助</label>
      <div class="radio-row">
        <label><input type="checkbox" id="chkReduce"> prefers-reduced-motion（模拟系统）</label>
      </div>
    </section>
    <div class="note">
      设计说明（V1）：
      1) 小数位取两值最大——45.29+0.01 显示 45.30（保留进位尾 0，机械感）；
      2) 新增小数/整数位：新列从 0 滚入（先 50.0 再滚 50.1）；
      3) 整数位缩减：app 侧为"共同结构滚动+延时移除前导列"（100→099→99），无空跳；
      4) 标签（右侧小数）= 真实值 String(n)，轮盘 = 机械显示（进位保留尾 0）。
      速度可在控制台调整：<code>--t-roll</code>。
    </div>
  </div>
</div>

<script>
'use strict'
const frame = document.getElementById('scoreFrame')
const scoreTextLabel = document.getElementById('scoreTextLabel')
const sliderVal = document.getElementById('sliderVal')
const reduceCheckbox = document.getElementById('chkReduce')
let variant = '1'
let current = 50          // 真实值（已 norm）
let speedFactor = 1
const LINE = 64
const CLAMP_MIN = 0
const CLAMP_MAX = 100

// 显示状态（V1）：布局规范串 + 各列物理位置
let dispStr = '50'        // 当前显示（规范串，含布局小数位）——上一目标值语义
let domSig = ''           // 当前 DOM 结构签名 '整数位.小数位'
let colStates = []        // 与 .odom-col 一一对应：{ phys, rows }（phys 为 strip 内绝对行索引）
let pendingCase = 0       // 边界演示的落点→滚动延时
const BLOCKS = 12         // 初始 0-9 块数（120 行）
const INIT_ROWS = BLOCKS * 10
const CENTER = BLOCKS * 5  // phys 初始位置 = CENTER + 数字（60+d，留 ±50 链式余量）

function norm(v) { return Math.round(v * 100) / 100 }
function clamp(v) { return Math.max(CLAMP_MIN, Math.min(CLAMP_MAX, v)) }

function scoreColor(score) {
  const t = Math.max(0, Math.min(1, (score - 30) / 50))
  const from = [96, 130, 182], to = [255, 122, 69]
  const mix = from.map((c, i) => Math.round(c + (to[i] - c) * t))
  return `rgb(${mix[0]}, ${mix[1]}, ${mix[2]})`
}

function reducedMotion() {
  return reduceCheckbox.checked ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
}

// ---------- 布局规范串（所有进位/边界决策的单一真源） ----------
function decCount(s) { const i = s.indexOf('.'); return i === -1 ? 0 : s.length - i - 1 }
function intLen(s) { const i = s.indexOf('.'); return i === -1 ? s.length : i }

// 值 → 规范串：d 位小数（不足补 0；d ≥ 值自带小数位，保证不截断）
function fmtVal(val, d) {
  const [iPart, dPart = ''] = String(val).split('.')
  return d > 0 ? `${iPart}.${dPart.padEnd(d, '0')}` : iPart
}

// 旧显示串 → 目标结构下的补齐串（整数字左补 0，小数右补 0）
function fmtPadded(s, toIntLen, toDecLen) {
  const [iPart, dPart = ''] = s.split('.')
  const ints = iPart.padStart(toIntLen, '0')
  return toDecLen > 0 ? `${ints}.${dPart.padEnd(toDecLen, '0')}` : ints
}

// ---------- V1 轮带式：每列 0-9 循环带 + 列状态机 ----------
function appendBlock(strip, st) {
  const frag = document.createDocumentFragment()
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span')
    s.textContent = String(i)
    frag.appendChild(s)
  }
  strip.appendChild(frag)
  st.rows += 10
}

function buildV1(frame, digitsStr) {
  frame.innerHTML = ''
  colStates = []
  for (const ch of digitsStr) {
    if (ch === '.') {
      const p = document.createElement('span')
      p.className = 'point'
      p.textContent = '.'
      frame.appendChild(p)
      continue
    }
    const col = document.createElement('span')
    col.className = 'odom-col'
    const strip = document.createElement('span')
    strip.className = 'strip'
    const st = { phys: CENTER + Number(ch), rows: 0 }
    for (let b = 0; b < BLOCKS; b++) appendBlock(strip, st)
    strip.style.transform = `translateY(-${st.phys * LINE}px)`
    col.appendChild(strip)
    frame.appendChild(col)
    colStates.push(st)
  }
  domSig = `${intLen(digitsStr)}.${decCount(digitsStr)}`
}

// 底部接近溢出：追加一块（追加不影响已有内容，无视觉跳变）
function ensureBottom(strip, st, next) {
  if (next > st.rows - 2) appendBlock(strip, st)
}

// 顶部溢出兜底：整列重建居中（需要 50+ 次连续向下绕行，实际不可达；保持显示正确）
function rebuildCol(colEl, st, digit) {
  const strip = colEl.querySelector('.strip')
  strip.replaceChildren()
  st.phys = CENTER + digit
  st.rows = 0
  for (let b = 0; b < BLOCKS; b++) appendBlock(strip, st)
  strip.style.transform = `translateY(-${st.phys * LINE}px)`
}

// 使该列从 a 滚到 b：短路径（差 >5 反向绕行，0↔9 只滚 1 格），phys 驱动
function rollCol(colEl, st, a, b) {
  if (a === b) return
  let diff = b - a
  if (diff > 5) diff -= 10
  if (diff < -5) diff += 10
  let next = st.phys + diff
  const strip = colEl.querySelector('.strip')
  if (next < 2) { rebuildCol(colEl, st, b); return }
  ensureBottom(strip, st, next)
  st.phys = next
  strip.style.transform = `translateY(-${next * LINE}px)`
}

function rollCols(fromStr, toStr) {
  const cols = frame.querySelectorAll('.odom-col')
  let ci = 0
  for (let i = 0; i < toStr.length; i++) {
    if (toStr[i] === '.') continue
    rollCol(cols[ci], colStates[ci], Number(fromStr[i]), Number(toStr[i]))
    ci++
  }
}

function v1Update(fromStr, toStr) {
  const toIntLen = intLen(toStr)
  if (intLen(fromStr) > toIntLen) {
    // 结构缩减（100.0→99.9）：瞬时重建——机械计数器无"缩短"，此时新结构无对应旧列
    buildV1(frame, toStr)
    return
  }
  const fromPadded = fmtPadded(fromStr, toIntLen, decCount(toStr))
  const sig = `${toIntLen}.${decCount(toStr)}`
  if (sig !== domSig) {
    // 结构增长：新建目标结构并定位到补齐起点（新列 0），随即滚到目标。
    // 新建元素无"之前渲染"状态，直接改 transform 不会触发 transition——
    // 必须强制一次样式提交（reflow），把补齐起点注册为过渡起点值，再滚
    buildV1(frame, fromPadded)
    void frame.offsetWidth
    rollCols(fromPadded, toStr)
    return
  }
  rollCols(fromPadded, toStr)
}

// ---------- 无动画（显示真实值） ----------
function buildV3(frame, digits) {
  frame.innerHTML = ''
  for (const ch of String(digits).split('')) {
    const s = document.createElement('span')
    s.className = ch === '.' ? 'point num' : 'num'
    s.textContent = ch
    frame.appendChild(s)
  }
}

// ---------- 外层渲染器 ----------
function render(rawVal, opts = {}) {
  const val = clamp(norm(rawVal))
  clearTimeout(pendingCase)
  pendingCase = 0
  const fromStr = dispStr
  const toStr0 = String(val)
  const d = Math.max(decCount(fromStr), decCount(toStr0))
  const toStr = fmtVal(val, d)
  current = val
  scoreTextLabel.textContent = toStr0
  sliderVal.textContent = toStr0
  frame.style.color = scoreColor(val)
  if (variant === '1') {
    if (toStr === fromStr) { dispStr = toStr; return }
    if (reducedMotion() || opts.instant) { buildV1(frame, toStr); dispStr = toStr; return }
    v1Update(fromStr, toStr)
  } else {
    buildV3(frame, toStr0)
  }
  dispStr = toStr
}

// 边界演示：先瞬时落到起点，400ms 后播放到目标的滚动
function runCase(from, to) {
  render(from, { instant: true })
  pendingCase = setTimeout(() => { pendingCase = 0; render(to) }, 400)
}

// ---------- 控件 ----------
const slider = document.getElementById('slider')
document.querySelectorAll('input[name=variant]').forEach((r) => {
  r.addEventListener('change', (e) => {
    variant = e.target.value
    buildVariant()
    render(current)
  })
})
document.querySelectorAll('input[name=speed]').forEach((r) => {
  r.addEventListener('change', (e) => {
    speedFactor = Number(e.target.value)
    document.documentElement.style.setProperty('--t-roll', `${Math.round(260 / speedFactor)}ms`)
  })
})
function buildVariant() {
  if (variant === '1') buildV1(frame, dispStr)
  else buildV3(frame, String(current))
}
document.getElementById('btnPlus').onclick = () => render(current + 1)
document.getElementById('btnMinus').onclick = () => render(current - 1)
document.getElementById('btnPlus01').onclick = () => render(current + 0.1)
document.getElementById('btnMinus01').onclick = () => render(current - 0.1)
document.getElementById('btnPlus001').onclick = () => render(current + 0.01)
document.getElementById('btnPlus5').onclick = () => render(current + 5)
document.getElementById('btnRandom').onclick = () => render(Math.round(Math.random() * 10000) / 100)
document.querySelectorAll('[data-case]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const [from, to] = btn.dataset.case.split(',')
    runCase(Number(from), Number(to))
  })
})
slider.addEventListener('input', (e) => render(Number(e.target.value)))
document.getElementById('chkReduce').addEventListener('change', () => { buildVariant(); render(current) })

buildVariant()
render(50)
</script>
</body>
</html>
