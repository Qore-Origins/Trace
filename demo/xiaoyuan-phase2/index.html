<header class="topbar"><div class="brand"><h1>小沅 / Xiaoyuan</h1><small id="subtitle"></small></div><div class="tools"><button id="language" type="button">English</button><button id="theme" type="button"></button><button id="reset" type="button"></button></div></header>

<script>
'use strict';
const $ = (selector) => document.querySelector(selector);
let lang = 'zh', flowStep = 0, mobileView = 'conversation', generation = 0, busy = false, modal = null, composing = false, renderedFlowStep = 0;
const t = (zh,en) => lang === 'zh' ? zh : en;
const esc = (value) => String(value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const targets = [{id:'plan',zh:'计划 · 秋季阅读',en:'Plan · Autumn reading'},{id:'folder',zh:'文件夹 · 学习',en:'Folder · Study'},{id:'review',zh:'计划 · 每周复盘',en:'Plan · Weekly review'}];
let selected = [];
let statuses, trash, requestText, uncertain, sources, batches, activeBatch, restoreReceipts;
const detailState = new Map();
const stageScrollPositions = [0,0,0];
function freezeMessage(text,targetIds,kind='send',payload=''){
 return Object.freeze({id:'message-'+String(sources.length+1).padStart(4,'0'),text,targets:Object.freeze([...targetIds]),kind,payload});
}
function allowed(index,source=activeBatch.source){return source.targets.includes('folder') || (index!==1 && source.targets.includes('plan'));}
function addBatch(source){
 const record={id:'batch-'+String(batches.length+42).padStart(4,'0'),source,continuationSources:[],turns:[{source,reply:''}],statuses:operationData.map((_,index)=>allowed(index,source)?'pending':'out-of-scope'),attemptLedger:Object.freeze([])};
 batches.push(record);activeBatch=record;statuses=record.statuses;
 return record;

 const draft=Object.freeze({text,targets:frozenTargets,kind,history:sources.map(source=>`${source.id}: ${source.text}`).join('\n'),results:kind==='continue'?results:null,attemptLedger:kind==='continue'?Object.freeze([...record.attemptLedger]):null,record,runGeneration});
 const canReadBody=frozenTargets.includes('plan')||frozenTargets.includes('folder');
 openDialog(t('独立外发确认 · 本地模拟','Isolated outgoing confirmation · local simulation'),`<p>${t('以下目标将冻结为这条消息的授权，标签元数据与正文附件分离。取消后可改标签再重新预览。没有网络请求。','These exact targets become the frozen grant for this message. Target metadata is separate from body attachments. Cancel to edit targets and preview again. No network request.')}</p><div class="scope" id="outgoing-targets"><strong>${t('本消息即将授权的精确目标','Exact targets this message will grant')}</strong><div class="chips">${targetChips(frozenTargets)}</div>${kind==='continue'?`<p>${t('继承冻结来源','Frozen source')} ${record.source.id} / ${record.id}</p>`:''}</div><div class="preview">${esc(text)}</div>${draft.results?`<section class="scope"><h3>${t('前一轮工具结果（冻结）','Previous tool results (frozen)')}</h3>${results.map(result=>`<p>${result.index+1}. ${esc(result.title)} · ${result.status==='out-of-scope'?t('未授权，不执行','Outside grant, blocked'):labelStatus(result.status)}</p>`).join('')}</section>`:''}<div class="context-list"><label class="check-row"><input type="checkbox" data-context="history" checked>${t('带入已确认的会话历史','Include approved conversation history')}</label><label class="check-row"><input type="checkbox" data-context="preference" checked>${t('带入已审核偏好：任务命名使用动词开头','Include reviewed preference: begin task names with verbs')}</label><label class="check-row"><input type="checkbox" data-context="body" ${canReadBody?'':'disabled'}>${t('附加范围内已本地读取的阅读摘要（默认不发送）','Attach reading summary read within grant (off by default)')}</label><h3>${t('准确外发内容','Exact outgoing content')}</h3><div id="payload" class="preview"></div></div>`,()=>{
  if(generation!==runGeneration||activeBatch!==record)return;
  const payload=$('#payload').textContent;
  const source=freezeMessage(draft.text,draft.targets,kind,payload);
  const attemptLedger=draft.attemptLedger;
  closeDialog();
  if(kind==='send'){sources.push(source);simulateResponse(source);}else reviewExecution('continue',{source,record,results,attemptLedger,runGeneration});
 },t('确认模拟外发','Confirm simulated send'),{draft});
 updatePayload();
}
function updatePayload(){
 const draft=modal.draft,on=name=>$(`[data-context="${name}"]`).checked;
 const targetMetadata=draft.targets.length?draft.targets.map(id=>{const target=targets.find(item=>item.id===id);return `${id}: ${target[lang]}`;}).join('; '):t('无 @ 授权；所有已有对象操作均越界阻止。','No @ grant; all existing-object operations are out of scope and blocked.');
 $('#payload').textContent=[t('目标元数据（不含正文）：','Target metadata (no bodies): ')+targetMetadata,draft.attemptLedger?t('完整先前尝试（按时间顺序）：\n','Complete previous attempts (in time order):\n')+ledgerText(draft.attemptLedger):null,draft.results?t('最新状态投影（不替代历史）：','Latest state projection (does not replace history): ')+draft.results.map(result=>`${result.index+1}. ${result.title}: ${result.status}`).join('\n'):null,t('本次用户请求：','Current user request: ')+draft.text,on('history')?t('历史：','History: ')+draft.history:null,on('preference')?t('偏好：任务名称以动词开头。','Preference: Begin task names with verbs.'):null,on('body')?t('阅读摘要：第一章已读完，等待整理三条笔记。（合成内容）','Reading summary: Chapter one finished; summarize three notes. (Synthetic content)'):null].filter(Boolean).join('\n\n');
 if(draft.attemptLedger&&!$('#dialog-content [data-attempt-ledger]'))$('#dialog-content .dialog-body > .preview').insertAdjacentHTML('beforebegin',ledgerView(draft.attemptLedger));
}
function reviewExecution(kind,continuation=null){
 if(uncertain||busy)return;
 const record=activeBatch,runGeneration=generation;
 if(continuation&&(continuation.record!==record||continuation.runGeneration!==runGeneration||continuation.results.some(result=>statuses[result.index]!==result.status)||continuation.attemptLedger.length!==record.attemptLedger.length))return;
 const indices=Object.freeze(statuses.flatMap((status,index)=>allowed(index)&&(kind==='retry'?status==='failed':status==='pending')?[index]:[]));
 if(!indices.length)return;
 const source=continuation?.source||record.source;
 openDialog(t('确认本地操作范围','Confirm local operation scope'),`<p>${t('本地新尝试只授权以下冻结操作；仍需勾选写入确认。取消不会执行，也不会更改批次。','This new local attempt grants only the frozen operations below; explicit write approval is still required. Cancel does not execute or change the batch.')}</p>${frozenScope(source)}${indices.map(i=>`<div class="scope"><h3>${i+1}. ${t(...operationData[i].title)}</h3><p>${t(...operationData[i].target)}</p><div class="diff"><div>${esc(t(...operationData[i].before))}</div><div>${esc(t(...operationData[i].after))}</div></div><p>${t(...operationData[i].reference)}</p></div>`).join('')}<label class="check-row"><input type="checkbox" id="write-grant">${t('我已核对目标、差异和引用影响，允许这些操作','I checked targets, differences, and references and approve these operations')}</label>`,()=>{
  if(!$('#write-grant').checked||generation!==runGeneration||activeBatch!==record)return;
  if(continuation){sources.push(source);record.attemptSource=source;record.continuationSources.push(source);record.turns.push({source,reply:t(`此续轮已绑定到 ${record.id}，继承来源消息的冻结授权；后续本地操作仍需单独确认。`,`This continuation is bound to ${record.id} and inherits its source message's frozen grant. Local operations still require separate confirmation.`)});}
  closeDialog();execute(kind,indices,record,source);
 },t('确认执行','Confirm execution'));$('[data-action="confirm"]').disabled=true;
}
function execute(kind,approvedIndices,record,source){
 if(uncertain||busy||record!==activeBatch||!approvedIndices?.length)return;
 const queue=approvedIndices.filter(index=>allowed(index)&&statuses[index]===(kind==='retry'?'failed':'pending'));
 if(queue.length!==approvedIndices.length)return;
 const attemptId=record.id+'-attempt-'+String(record.attemptLedger.filter(event=>event.phase==='approved').length+1).padStart(2,'0');
 appendAttemptEvent(record,{attemptId,phase:'approved',kind,source,calls:Object.freeze(queue.map(callSnapshot))});
 busy=true;const runGeneration=generation;let cursor=0;const outcomes=new Map();
 function settle(stopped){
  const results=Object.freeze(operationData.map((_,index)=>Object.freeze({call:callSnapshot(index),status:outcomes.get(index)||'not-executed',reason:Object.freeze(outcomes.get(index)==='failed'?['预览后目标版本变化；后续调用停止。','Target version changed after preview; later calls stopped.']:outcomes.has(index)?['本次调用成功。','This call succeeded.']:!queue.includes(index)?['不属于本次批准调用；此前结果保留，不重放。','Not approved in this attempt; prior results retained without replay.']:stopped?['此前调用失败，未执行此项。','An earlier call failed; this item was not executed.']:['本次未执行。','Not executed in this attempt.'])})));
  appendAttemptEvent(record,{attemptId,phase:'settled',kind,source,results});busy=false;render();
 }
 function next(){
  if(runGeneration!==generation)return;
  if(cursor>=queue.length){settle(false);say('本次尝试已结束；历史回执只追加，成功项未重放。','Attempt finished; receipts were appended, completed calls were not replayed.');return;}
  const index=queue[cursor++];statuses[index]='running';render();
  setTimeout(()=>{
   if(runGeneration!==generation)return;
   if(index===1&&kind==='execute'){statuses[index]='failed';outcomes.set(index,'failed');settle(true);say('第二项失败，后续操作已停止。失败原因与未执行项已保留在首轮回执。','The second item failed and later calls stopped. Failure reason and unexecuted items are retained in the initial receipt.');return;}
   statuses[index]='success';outcomes.set(index,'success');
    if(index===2&&!trash.some(item=>item.id==='new-plan'))trash.push({id:'new-plan',zh:'旧阅读计划',en:'Old reading plan',kind:['计划','Plan'],path:'学习 / 秋季阅读 / 旧阅读计划',conflict:false});next();
  },650);
 }next();
}
function simulateResponse(source){
 busy=true;const runGeneration=generation;const record=addBatch(source),turn=record.turns[0];
 const words=source.targets.length?(lang==='zh'?['已确认外发预览。','正在检查冻结目标范围。','新批次只允许消息授权范围内的操作。']:['Outgoing preview approved. ','Checking frozen target scope. ','A new batch permits only operations within this message grant.']):(lang==='zh'?['这条消息没有 @ 目标，因此不会操作任何已有计划或文件夹。','需要操作已有计划时，请用 @ 指定目标；新建计划或文件夹无需 @。','当前批次的已有对象工具全部标记为越界并阻止执行。']:['This message has no @ targets, so no existing plan or folder will be operated on.','To work on existing plans, use @ to specify a target; new plans or folders need no @.','All existing-object tools in this batch are marked out of scope and blocked.']);let index=0;render();
 function tick(){if(runGeneration!==generation)return;turn.reply+=words[index++];if(index===words.length){busy=false;render();say('模拟响应已绑定当前批次；旧批次范围保留。','The simulated reply is bound to the selected batch; older grants remain unchanged.');return;}render();setTimeout(tick,450);}setTimeout(tick,450);
}
function restoreItem(id){
 const item=trash.find(row=>row.id===id);if(!item)return;
 openDialog(t('恢复到本地计划','Restore to local plan'),`<p>${esc(item[lang])}</p><div class="scope">${t('原位置：','Original location: ')}${esc(item.path)}</div>${item.conflict?`<div class="warning">${t('同名项目已存在。不会覆盖它，请指定新名称。','An item with this name exists. It will not be overwritten; choose a new name.')}</div><label class="field" for="restore-name">${t('恢复名称（单个名称，不含路径分隔符）','Restore name (one name, no path separators)')}</label><input id="restore-name" value="${esc(item[lang]+t('（恢复）',' (restored)'))}">`:`<p>${t('将保留原项目身份与引用，回到原位置。','Preserve item identity and references at its original location.')}</p>`}<p id="restore-error" role="alert"></p>`,()=>{
  const name=item.conflict?$('#restore-name').value.trim():item[lang];
  if(!name||name===item[lang]&&item.conflict||/[\\/]/.test(name)){$('#restore-error').textContent=t('请填写不同于原名称且不含路径分隔符的新名称。','Enter a new name without path separators, different from the original.');return;}
  const parent=item.path.split(' / ').slice(0,-1).join(' / ');
  const location=parent+' / '+name;
  restoreReceipts.push(Object.freeze({id:item.id,name,location}));trash=trash.filter(row=>row.id!==id);
  closeDialog();render();say(`已模拟恢复：${name} · ${location}；未覆盖同名项目。`,`Restored in simulation: ${name} · ${location}; no existing item was overwritten.`);
 },t('确认恢复','Confirm restore'));
}
function purgeItem(id){const item=trash.find(row=>row.id===id);if(!item)return;const phrase=t('永久清除','DELETE');openDialog(t('永久清除 · 无法撤销','Permanent deletion · cannot undo'),`<div class="warning"><strong>${esc(item[lang])}</strong>${t('只清除这一项的本地回收副本，无法恢复。','Delete only this local Trash copy. It cannot be recovered.')}</div><p>${esc(item.path)}</p><label class="field" for="purge-phrase">${t('输入“永久清除”确认','Type DELETE to confirm')}</label><input id="purge-phrase" autocomplete="off">`,()=>{if($('#purge-phrase').value!==phrase)return;trash=trash.filter(row=>row.id!==id);closeDialog();render();say('该合成项目已永久清除。','The synthetic item was permanently deleted.');},t('永久清除这一项','Permanently delete this item'),{danger:true,phrase});}
function dispatch(action){if(action==='cancel'){closeDialog();return;}if(action==='confirm'){modal?.confirm();return;}if(action.startsWith('step:')){flowStep=Number(action.split(':')[1]);render();return;}if(action==='targets'){openDialog(t('选择本次操作目标','Choose targets for this message'),`<p>${t('可选择多个计划或文件夹；不选择也可以发送普通消息，但该消息不能操作任何已有计划或文件夹。目标只限定本次本地读取范围，不自动发送内容。','Choose plans or folders, or leave all unchecked for ordinary chat. Without targets, this message cannot operate on existing plans or folders. Targets only limit local read scope; they do not attach content.')}</p>${targets.map(target=>`<label class="check-row"><input type="checkbox" name="target" value="${target.id}" ${selected.includes(target.id)?'checked':''}>${esc(target[lang])}</label>`).join('')}`,()=>{selected=[...document.querySelectorAll('[name="target"]:checked')].map(input=>input.value);closeDialog();render();},t('使用这些目标','Use these targets'));return;}if(action==='send'){outbound('send');return;}if(action==='execute'){reviewExecution('execute');return;}if(action==='retry'){reviewExecution('retry');return;}if(action==='continue'){outbound('continue');return;}if(action==='undo'){if(uncertain||busy)return;const index=statuses.findIndex(s=>s==='success');if(index<0)return;openDialog(t('撤销安全成功项','Undo safe completed item'),`<p>${t(...operationData[index].title)}</p><p>${t('目标版本复核通过（模拟）；仅撤销此项，其他成功项保留。','Target version recheck passed (simulation); undo only this item, retain other completed work.')}</p>`,()=>{statuses[index]='undone';if(index===2)trash=trash.filter(item=>item.id!=='new-plan');closeDialog();render();say('安全成功项已撤销。','Safe completed item undone.');},t('确认撤销','Confirm undo'));return;}if(action.startsWith('restore:'))restoreItem(action.split(':')[1]);if(action.startsWith('purge:'))purgeItem(action.split(':')[1]);}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;if(button.dataset.action.startsWith('mobile:')){mobileView=button.dataset.action.slice('mobile:'.length);render();return;}dispatch(button.dataset.action);});
document.addEventListener('input',event=>{if(event.target.id==='request')requestText=event.target.value;if(event.target.id==='purge-phrase')$('[data-action="confirm"]').disabled=event.target.value!==modal.phrase;});
document.addEventListener('change',event=>{if(event.target.dataset.context)updatePayload();if(event.target.id==='write-grant')$('[data-action="confirm"]').disabled=!event.target.checked;if(event.target.id==='batch-choice'&&!busy){const record=batches.find(item=>item.id===event.target.value);if(record){activeBatch=record;statuses=record.statuses;render();}}});
$('#dialog').addEventListener('cancel',()=>{modal=null;});$('#language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';document.documentElement.lang=lang==='zh'?'zh-CN':'en';render();});$('#theme').addEventListener('click',()=>{document.documentElement.classList.toggle('theme-dark');render();});$('#reset').addEventListener('click',reset);$('#scenario').addEventListener('change',reset);
document.addEventListener('keydown',event=>{if(event.isComposing||event.keyCode===229)return;if(event.target.id==='request'&&event.ctrlKey&&event.key==='Enter'){event.preventDefault();if(!busy)outbound('send');return;}if(event.target.closest?.('#mobile-switch')&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();const tabs=[...$('#mobile-switch').querySelectorAll('[role="tab"]')],index=tabs.indexOf(event.target),next=tabs[(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length];next?.focus();next?.click();}});
reset();
</script>
</body>
