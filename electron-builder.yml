appId: com.qore.trace
productName: 溯源 Trace
copyright: Copyright (c) 2026 Qore

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: 溯源 Trace

publish: null
